name: Release

# 推送 v* tag 会自动构建发布包并创建 GitHub Release。
# 需要补发历史版本时，在 Actions 页面手动触发本工作流并填入已存在的 tag。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.0.12（必须已存在）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest.version
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          version="$(node -p 'require("./manifest.json").version')"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag ${tag} 与 manifest.json 的版本 ${version} 不一致"
            exit 1
          fi
          echo "发布版本：v${version}"

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build release archive
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          npm run build
          cd dist
          sha256sum bilibili-subtitle-ai-v*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/bilibili-subtitle-ai-v*.zip
            dist/SHA256SUMS.txt
