<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B站字幕 AI 总结</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="../icons/icon48.png" alt="" width="36" height="36" />
      <div class="header-text">
        <h1>字幕总结</h1>
        <p>Bilibili × AI</p>
      </div>
      <span class="ai-badge">AI</span>
    </header>

    <main>
      <section class="page-card" id="pageCard">
        <span class="status-dot" id="statusDot"></span>
        <div class="page-text">
          <div class="page-label">当前页面</div>
          <div class="page-value" id="pageValue">正在检测…</div>
        </div>
      </section>

      <button class="open-btn" id="openBtn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.2l1.55 4.25L17.8 9l-4.25 1.55L12 14.8l-1.55-4.25L6.2 9l4.25-1.55L12 3.2Z" />
          <path d="M18.4 15.1l.72 1.98 1.98.72-1.98.72-.72 1.98-.72-1.98-1.98-.72 1.98-.72.72-1.98Z" />
        </svg>
        <span id="openLabel">打开字幕面板</span>
      </button>

      <button class="refresh-btn" id="refreshBtn" type="button" hidden>刷新 B站页面后再试</button>

      <div class="features">
        <div class="feature">
          <span class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" /><path d="M7 10h4M7 14h2M13 14h4M15 10h2" />
            </svg>
          </span>
          <div><b>字幕</b><small>SRT / TXT</small></div>
        </div>
        <div class="feature">
          <span class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
              <path d="M14 2v6h6" /><path d="M8 13h8M8 17h6" />
            </svg>
          </span>
          <div><b>AI 总结</b><small>MD / TXT</small></div>
        </div>
      </div>

      <p class="tip" id="tip">在 B站视频/列表播放页点击扩展图标，或直接使用页面右侧悬浮按钮。没有 API Key 也可以在「AI 总结」页复制提示词。</p>
    </main>

    <footer>
      <button class="settings-link" id="settingsBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
        </svg>
        设置
      </button>
      <span class="version">v<span id="version">1.0.9</span></span>
    </footer>

    <script src="../shared/utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
